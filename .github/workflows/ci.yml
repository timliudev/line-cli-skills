name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10
      - run: uv tool install ruff
      - run: python -m pip install pytest
      - run: ruff check .
      - run: python -m pytest -q

  validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    # `claude plugin validate` is an offline manifest check and needs no auth
    # in local testing; kept non-blocking in case a CLI release changes that.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
      - run: claude plugin validate plugins/line-cli --strict
      - run: claude plugin validate plugins/media-digest --strict

  docs-sync:
    name: docs-sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Require docs changes alongside plugin changes
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: >
          python tools/check_docs_sync.py
          "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
          --labels "$LABELS"
