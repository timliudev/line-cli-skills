name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # No uv here: the tests never call it, and `astral-sh/setup-uv@v10` is not a published tag.
      - run: python -m pip install pytest ruff
      - run: python -m ruff check .
      # Tests that need ffmpeg skip themselves when it is missing; the `media-ffmpeg` job below
      # runs them against a real ffmpeg.
      - run: python -m pytest -q

  media-ffmpeg:
    name: media tests with ffmpeg (ubuntu)
    runs-on: ubuntu-latest
    # Extra signal only: it depends on whatever ffmpeg build apt ships, so it never blocks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/media_digest

  validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    # `claude plugin validate` is an offline manifest check and needs no auth
    # in local testing; kept non-blocking in case a CLI release changes that.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
      - run: claude plugin validate plugins/line-cli --strict
      - run: claude plugin validate plugins/media-digest --strict

  docs-sync:
    name: docs-sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Require docs changes alongside plugin changes
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: >
          python tools/check_docs_sync.py
          "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
          --labels "$LABELS"
